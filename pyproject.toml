[project]
name = "protein-function-prediction"
version = "0.1.0"
description = "GO term prediction from protein sequences (human, mouse, zebrafish)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.23",
    "pandas>=3.1.1",
    "scikit-bio>=0.7.4",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
